# Apache Virtual Host конфигурацияси
<VirtualHost *:80>
    ServerName domproduct.local
    DocumentRoot /var/www/domproduct.uz/public

    <Directory /var/www/domproduct.uz/public>
        AllowOverride All
        Require all granted

        # JavaScript файллар учун тўғри MIME type
        <FilesMatch "\.js$">
            ForceType application/javascript
        </FilesMatch>

        # CSS файллар учун тўғри MIME type
        <FilesMatch "\.css$">
            ForceType text/css
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/domproduct_error.log
    CustomLog ${APACHE_LOG_DIR}/domproduct_access.log combined
</VirtualHost>
